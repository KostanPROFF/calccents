name: Probe scoped token

# One-off probe: can this account mint a token limited to sending email?
# The contact form will hold a runtime credential, so it must not be a
# token that can manage the whole account.

on:
  workflow_dispatch:

jobs:
  probe:
    name: Probe scoped token
    runs-on: ubuntu-latest
    steps:
      - name: Inspect the token and the permission groups
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          echo "--- token verify ---"
          curl -sS "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" | head -c 400
          echo
          echo "--- permission groups containing email ---"
          curl -sS "https://api.cloudflare.com/client/v4/user/tokens/permission_groups" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            | node -e 'let r="";process.stdin.on("data",c=>r+=c).on("end",()=>{const b=JSON.parse(r);if(!b.success){console.log("cannot list:",(b.errors??[]).map(e=>`${e.code}: ${e.message}`).join("; "));return;}const out=[];for(const p of b.result??[]){for(const g of p.groups??[]){if(/email/i.test(g.name+" "+(g.description??""))){out.push(`${g.id} = ${g.name} (${p.id})`);}}}console.log(out.join("\n")||"none found");});'

          echo "--- try to mint a scoped token ---"
          curl -sS -X POST "https://api.cloudflare.com/client/v4/user/tokens" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d '{"name":"calccents-contact-form","scope":["com.cloudflare.api.account.email_sending"],"policy":{"effect":"allow","resources":{"com.cloudflare.api.account.zone.${CLOUDFLARE_ACCOUNT_ID}":"*"}}}' \
            | node -e 'let r="";process.stdin.on("data",c=>r+=c).on("end",()=>{const b=JSON.parse(r);console.log("success:",b.success);console.log(JSON.stringify(b.errors??[]).slice(0,600));if(b.success){console.log("value:",b.result?.value);}});'
