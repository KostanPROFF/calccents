name: Probe send_email binding

# One-off probe: does the send_email binding work on this account, and is
# it permitted to send from a domain that is not onboarded for sending?
# If it works, the contact form needs no runtime credential at all.

on:
  workflow_dispatch:

jobs:
  probe:
    name: Probe send_email binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy the probe worker
        run: pnpm exec wrangler deploy --config worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Call the worker
        run: |
          set -uo pipefail
          URL=$(pnpm exec wrangler deployments list --config worker/wrangler.toml --json 2>/dev/null | head -c 200 || true)
          echo "deployments: ${URL}"
          echo "--- try the worker over its workers.dev name ---"
          curl -sS --max-time 30 "https://calccents-contact-mailer.workers.dev" \
            | head -c 1200
          echo
