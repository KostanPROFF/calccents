name: Probe pages project

# One-off probe: what is the Pages project configured with right now?
# Adding a Functions directory makes the Wrangler file the source of truth
# for the project, so the current settings have to be read first.

on:
  workflow_dispatch:

jobs:
  probe:
    name: Probe pages project
    runs-on: ubuntu-latest
    steps:
      - name: Read the project configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          curl -sS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/calccents" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            | node -e 'let r="";process.stdin.on("data",c=>r+=c).on("end",()=>{const b=JSON.parse(r);if(!b.success){console.log("failed:",(b.errors??[]).map(e=>`${e.code}: ${e.message}`).join("; "));return;}const p=b.result;console.log("name:",p.name);console.log("production_branch:",p.production_branch);console.log("build_config:",JSON.stringify(p.build_config));console.log("deployment_configs:",JSON.stringify(p.deployment_configs,null,2));console.log("domains:",(p.domains??[]).map(d=>`${d.name} [${d.status}]`).join(", "));console.log("source:",JSON.stringify(p.source));});'
