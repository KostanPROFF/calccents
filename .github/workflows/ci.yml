name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version here on purpose: the action refuses to run when the
      # version is given twice, and packageManager in package.json already
      # pins pnpm to an exact version. One source of truth, no mismatch.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Unit tests with coverage
        run: pnpm test

      - name: Linters
        run: pnpm lint

      # The ad gate has two states and both are worth proving. The loader
      # script is on every page in both of them, because that is what turns
      # on auto ads. What changes is the hand-placed units: this build
      # carries dummy slot IDs so they render, which is what the site looks
      # like once the units are configured.
      - name: Build with the ad units enabled
        run: pnpm build
        env:
          PUBLIC_ADSENSE_CLIENT: ca-pub-0000000000000000
          PUBLIC_ADSENSE_SLOT_RESULT: 1111111111
          PUBLIC_ADSENSE_SLOT_IN_ARTICLE: 2222222222
          PUBLIC_ADSENSE_SLOT_FOOTER: 3333333333

      - name: Ad gating check with the ad units enabled
        run: node scripts/check-ads.ts --expect-slots

      # The ad units are on the page in this build, so this is the build
      # that proves they stay hidden until the reader has answered.
      - name: Consent gating check with the ad units enabled
        run: pnpm lint:consent

      # This is the build that ships: the loader script, and no ad units,
      # because no slot IDs are configured.
      - name: Build
        run: pnpm build

      - name: Ad gating check
        run: pnpm lint:ads

      # The trackers are loaded by the consent component and by nothing
      # else, so the build has to prove that neither script tag is in the
      # document and that the banner is on every page.
      - name: Consent gating check
        run: pnpm lint:consent

      - name: DOM id check
        run: pnpm lint:ids

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # No version here on purpose: the action refuses to run when the
      # version is given twice, and packageManager in package.json already
      # pins pnpm to an exact version. One source of truth, no mismatch.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The build happens here, not on Cloudflare, so the public build
      # variables live in the repository's Actions variables rather than in
      # Cloudflare's project settings.
      - name: Build
        run: pnpm build
        env:
          PUBLIC_ADSENSE_CLIENT: ${{ vars.PUBLIC_ADSENSE_CLIENT }}
          PUBLIC_ADSENSE_SLOT_RESULT: ${{ vars.PUBLIC_ADSENSE_SLOT_RESULT }}
          PUBLIC_ADSENSE_SLOT_IN_ARTICLE: ${{ vars.PUBLIC_ADSENSE_SLOT_IN_ARTICLE }}
          PUBLIC_ADSENSE_SLOT_FOOTER: ${{ vars.PUBLIC_ADSENSE_SLOT_FOOTER }}
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
          PUBLIC_BUTTONDOWN_FORM: ${{ vars.PUBLIC_BUTTONDOWN_FORM }}

      # The build that ships has to match the configuration.
      #
      # The verify job proves both states build cleanly. This one proves
      # that the build about to be published is in the state the
      # variables describe: all four ad variables set means ads on, none
      # set means ads off, and a partial configuration stops the deploy
      # rather than shipping a loader script with no ad units.
      - name: Ad gating check for the build that ships
        run: node scripts/check-ads.ts --auto
        env:
          PUBLIC_ADSENSE_CLIENT: ${{ vars.PUBLIC_ADSENSE_CLIENT }}
          PUBLIC_ADSENSE_SLOT_RESULT: ${{ vars.PUBLIC_ADSENSE_SLOT_RESULT }}
          PUBLIC_ADSENSE_SLOT_IN_ARTICLE: ${{ vars.PUBLIC_ADSENSE_SLOT_IN_ARTICLE }}
          PUBLIC_ADSENSE_SLOT_FOOTER: ${{ vars.PUBLIC_ADSENSE_SLOT_FOOTER }}

      - name: Consent gating check for the build that ships
        run: pnpm lint:consent

      # The mailer worker is deployed first, because the Pages project binds
      # to it and a binding to a worker that does not exist yet fails the
      # deploy. The worker holds no credential: the send_email binding is
      # authorised by the account, so there is no token to pass to it.
      - name: Deploy the contact mailer
        run: pnpm exec wrangler deploy --config worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The deploy is skipped until the two Cloudflare secrets exist. The
      # check lives in the shell rather than in an `if:` expression, because
      # the secrets context is not available in step conditions and GitHub
      # rejects the whole workflow file if it appears there. This keeps the
      # pipeline green on every push until the secrets are added, and the
      # next push deploys on its own.
      - name: Deploy
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Deployment skipped: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set."
            echo "::notice::Add them under Settings -> Secrets and variables -> Actions -> Repository secrets."
            echo "::notice::The next push to main will deploy automatically."
            exit 0
          fi
          # The project does not have to exist beforehand. Creating it here
          # means the pipeline works from nothing but the two secrets.
          pnpm exec wrangler pages project create calccents --production-branch main \
            || echo "::notice::Project calccents already exists, continuing."
          # The Wrangler file at the root of the repository holds the build
          # output directory and the service binding, so no directory is
          # passed here: the file is the source of truth for the project.
          pnpm exec wrangler pages deploy --project-name=calccents --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The hosting provider can add its own beacon to every page it
      # serves, and that one reports the page view before the reader has
      # answered the cookie question. The site removes it before it runs,
      # so nothing is reported early either way, but the file is still
      # downloaded while the automatic setup is on. The automatic setup is
      # off now, so the file is not downloaded either, and the promise the
      # privacy policy makes holds as it is written.
      #
      # This step says which of the two states the site is in. It does not
      # fail the pipeline: the setting lives in the Cloudflare dashboard,
      # not in the repository, and a step that runs after the deploy has
      # shipped cannot stop it anyway.
      - name: Hosting beacon at the edge
        continue-on-error: true
        run: pnpm lint:edge
